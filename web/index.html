<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEB-aristo</title>
<link rel="icon" href="heb.svg">
<meta name="robots" content="noindex">
<style>
  :root { --naranja: #dc291e; --claro: #fdf2f1; --borde: #f5c6c2; --gris: #6b7280; --texto: #111827; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--texto); background: #fafafa; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
  .logo { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
  h1 span { color: var(--naranja); }
  .sub { color: var(--gris); font-size: 14px; text-align: center; margin: 0 0 18px; }
  .caja { border: 1px solid var(--borde); border-radius: 18px; background: #fff; padding: 16px; box-shadow: 0 10px 30px -18px rgba(220,41,30,.45); }
  #hilo { min-height: 160px; max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .m { max-width: 85%; padding: 8px 14px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; }
  .yo { align-self: flex-end; background: var(--naranja); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--claro); border-bottom-left-radius: 4px; }
  .bot code { background: #fadfdc; padding: 0 4px; border-radius: 4px; font-size: 13px; }
  .voz { font-size: 12px; color: var(--gris); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { font-size: 12px; border: 1px solid var(--borde); color: #b91c1c; background: var(--claro); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  form { display: flex; gap: 8px; }
  input { flex: 1; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; font: inherit; }
  input:focus { outline: none; border-color: var(--naranja); }
  button.b { border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; color: #fff; background: var(--naranja); cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #mic.grabando { background: #dc2626; animation: pulso 1s infinite; }
  @keyframes pulso { 50% { opacity: .6; } }
  .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--gris); }
  .pie button { background: none; border: 0; color: var(--gris); text-decoration: underline; cursor: pointer; font: inherit; }
  .firma { text-align: center; color: var(--gris); font-size: 13px; margin-top: 18px; }
  .puntos span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--naranja); animation: salto .9s infinite; }
  .puntos span:nth-child(2) { animation-delay: .15s; } .puntos span:nth-child(3) { animation-delay: .3s; }
  @keyframes salto { 50% { transform: translateY(-4px); opacity: .5; } }
</style>
</head>
<body>
<main>
  <div class="logo"><img src="heb.svg" alt="H-E-B" height="40"></div>
  <h1>HEB<span>-aristo</span></h1>
  <p class="sub">Asistente de la gerente regional: cifras de tus cuatro tiendas y políticas internas, con fuente.</p>
  <div class="caja">
    <div id="hilo">
      <div id="inicio">
        <p style="margin:0 0 10px;color:var(--gris)">Pregunta por texto o toca 🎙️ para hablar (otro toque envía).</p>
        <div class="chips">
          <button type="button">¿Cuánto vendió T02 en julio de 2026?</button>
          <button type="button">¿Qué productos de T02 hay que reordenar?</button>
          <button type="button">¿Cuántos días tiene un cliente para devolver una licuadora?</button>
        </div>
      </div>
    </div>
    <form id="f">
      <input id="t" placeholder="Escribe tu pregunta…" maxlength="2000" autocomplete="off">
      <button type="button" id="mic" class="b" title="Toca para grabar; toca otra vez para enviar" aria-label="Grabar voz">🎙️</button>
      <button type="submit" id="env" class="b">Enviar</button>
    </form>
    <div class="pie"><span id="estado"></span><button type="button" id="nueva">Nueva conversación</button></div>
  </div>
  <p class="firma">Desarrollado por <b>Andrés Gallegos Díaz</b> · Ejercicio práctico H-E-B, 2026</p>
</main>
<script>
// Endpoint PÚBLICO del proxy en n8n (sin bearer: el proxy limita origen, ritmo y tamaño). Igual que el chat del portafolio.
const PROXY = "https://n8n-n8n.x09761.easypanel.host/webhook/heb-aristo/web/chat";
const $ = (s) => document.querySelector(s);
const hilo = $("#hilo"), t = $("#t"), env = $("#env"), mic = $("#mic"), estado = $("#estado");
let previo = "", ocupado = false;

function burbuja(cls, html) { const d = document.createElement("div"); d.className = "m " + cls; d.innerHTML = html; hilo.appendChild(d); hilo.scrollTop = hilo.scrollHeight; return d; }
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// El proxy devuelve reply_html ya saneado por el mismo conversor que Telegram (solo b/i/u/code/s); por eso se pinta como HTML.
function ocupar(v) { ocupado = v; env.disabled = mic.disabled = t.disabled = v; }

async function enviar(cuerpo, etiqueta) {
  if (ocupado) return;
  $("#inicio")?.remove();
  if (etiqueta) burbuja("yo", esc(etiqueta));
  ocupar(true);
  const p = burbuja("bot puntos", "<span></span><span></span><span></span>");
  try {
    const r = await fetch(PROXY, { method: "POST", body: cuerpo, headers: cuerpo instanceof FormData ? {} : { "Content-Type": "application/json" } });
    const j = await r.json().catch(() => ({}));
    p.remove();
    if (j.transcripcion) burbuja("yo", esc(j.transcripcion) + '<div class="voz">🎙️ transcripción</div>');
    if (r.ok && j.reply_html) { burbuja("bot", j.reply_html); if (j.response_id) previo = j.response_id; }
    else burbuja("bot", esc(j.error?.message || "No pude responder ahora mismo. Inténtalo de nuevo."));
  } catch { p.remove(); burbuja("bot", "No pude conectar. Inténtalo en un momento."); }
  ocupar(false); t.focus();
}
function texto(q) { const s = q.trim(); if (!s) return; t.value = ""; enviar(JSON.stringify(previo ? { input: s, previous_response_id: previo } : { input: s }), s); }
$("#f").onsubmit = (e) => { e.preventDefault(); texto(t.value); };
document.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => texto(b.textContent)));
$("#nueva").onclick = () => { previo = ""; hilo.innerHTML = ""; burbuja("bot", "Listo, empezamos de cero. ¿Qué quieres saber?"); };

// Voz: MediaRecorder, siguiendo las guías de MDN/WebKit:
//  - pedir el micrófono SOLO desde un click (WebKit no concede activación en pointerdown) y en HTTPS;
//  - elegir el contenedor con isTypeSupported (Chrome/Firefox/Android: webm/opus; Safari/iOS: mp4/aac; Safari 18.4+: también webm);
//  - NO fijar mimeType si el navegador no lo soporta (en iOS lanzaría NotSupportedError); dejar que elija;
//  - timeslice en start() para que iOS entregue datos aunque el clip sea corto; parar las pistas al terminar;
//  - tratar NotAllowedError como decisión del usuario y decirle dónde cambiarla; mostrar el error real, no uno genérico.
const MIME = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find((m) => window.MediaRecorder?.isTypeSupported?.(m)) || "";
let rec = null, trozos = [], stream = null;
const diag = (m) => { estado.textContent = m; console.warn(m); };
if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { mic.hidden = true; }
async function grabar() {
  if (ocupado || rec) return;
  // Android (Chrome/Brave) puede mostrar la petición como un icono discreto en la barra de direcciones en vez de pop-up
  // ("solicitudes silenciosas", tras un rechazo previo): la promesa se queda esperando. Se avisa a los 3 s.
  estado.textContent = "Pidiendo permiso de micrófono…";
  const aviso = setTimeout(() => respaldo("El navegador no mostró el aviso de micrófono."), 4000);
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { clearTimeout(aviso); stream = null;
    return respaldo(e?.name === "NotAllowedError" ? "Micrófono denegado por el navegador." : "Micrófono no disponible (" + (e?.name || "error") + ").");
  }
  clearTimeout(aviso);
  try { rec = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined); }
  catch (e) { try { rec = new MediaRecorder(stream); } catch (e2) { stream.getTracks().forEach((x) => x.stop()); return diag("MediaRecorder falló: " + (e2?.name || e?.name)); } }
  trozos = [];
  rec.ondataavailable = (e) => e.data && e.data.size && trozos.push(e.data);
  rec.onerror = (e) => diag("Error al grabar: " + (e.error?.name || "desconocido"));
  rec.onstop = () => {
    stream.getTracks().forEach((x) => x.stop());
    const tipo = rec.mimeType || MIME || "audio/webm"; rec = null;
    const blob = new Blob(trozos, { type: tipo });
    mic.classList.remove("grabando"); mic.textContent = "🎙️"; estado.textContent = "";
    if (blob.size < 1500) return diag("Muy corto (" + blob.size + " B): habla y vuelve a tocar para enviar.");
    const ext = tipo.includes("mp4") ? "m4a" : tipo.includes("ogg") ? "ogg" : "webm";
    const fd = new FormData(); fd.append("audio", blob, "voz." + ext); if (previo) fd.append("previous_response_id", previo);
    enviar(fd, null);
  };
  rec.start(250); mic.classList.add("grabando"); mic.textContent = "⏹"; estado.textContent = "Grabando (" + (rec.mimeType || "auto") + ")… toca ⏹ para enviar.";
}
function parar() { if (rec && rec.state === "recording") rec.stop(); }
function respaldo(motivo) { diag(motivo + " Revisa el permiso de micrófono del navegador y vuelve a intentar."); }
mic.onclick = () => (rec ? parar() : grabar());
</script>
</body>
</html>
